name: Build Debug APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
      GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required configuration
        run: |
          test -n "$MAPS_API_KEY"
          test -n "$GOOGLE_SERVICES_JSON"

      - name: Restore Firebase configuration
        run: printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json

      - name: Configure Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Run unit tests
        run: gradle --no-daemon -PMAPS_API_KEY="$MAPS_API_KEY" testDebugUnitTest

      - name: Build debug APK
        run: gradle --no-daemon -PMAPS_API_KEY="$MAPS_API_KEY" assembleDebug

      - name: Prepare named APK
        run: cp app/build/outputs/apk/debug/app-debug.apk TALLEDO-FAMILY-v3-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TALLEDO-FAMILY-v3-debug-apk
          path: TALLEDO-FAMILY-v3-debug.apk
          if-no-files-found: error
          retention-days: 30
